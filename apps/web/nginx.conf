server {
  # Railway dinamik port atar (PORT env). Yoksa 80'e düşer.
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: istemci tarafı rotalar için index.html sun
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hash'li asset'ler için uzun cache
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Railway healthcheck
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok";
  }
}
