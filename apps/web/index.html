<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="flinkli — QR-Rechnung und Kundenverwaltung für Schweizer Freelancer. Rechnungen in Sekunden erstellen."
    />
    <meta name="theme-color" content="#4f46e5" />
    <title>flinkli — QR-Rechnung für Freelancer</title>

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="flinkli" />
    <meta property="og:title" content="flinkli — QR-Rechnung für Freelancer" />
    <meta
      property="og:description"
      content="QR-Rechnungen nach Swiss Payment Standards 2026. In Sekunden erstellt, für Schweizer Freelancer."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:url" content="https://flinkli.ch/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="flinkli — QR-Rechnung für Freelancer" />
    <meta
      name="twitter:description"
      content="QR-Rechnungen nach Swiss Payment Standards 2026. In Sekunden erstellt, für Schweizer Freelancer."
    />
    <meta name="twitter:image" content="/og-image.svg" />
    <script>
      // Apply the saved theme before paint to avoid a flash of the wrong
      // colour scheme while the React bundle loads. Light is the default;
      // we do not follow the OS `prefers-color-scheme` setting.
      (function () {
        try {
          var stored = localStorage.getItem("flinkli.theme");
          var theme = stored === "dark" ? "dark" : "light";
          if (theme === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
