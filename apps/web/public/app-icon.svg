<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fl-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e23b2e"/>
      <stop offset="55%" stop-color="#d52b1e"/>
      <stop offset="100%" stop-color="#b81f14"/>
    </linearGradient>
    <linearGradient id="fl-sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fdeceb"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed Swiss-red tile. No rounded corners here: the OS applies its
       own mask (iOS squircle, Android adaptive icon), so we fill the whole
       canvas to avoid double-rounded corners and transparent edges. -->
  <rect width="512" height="512" fill="url(#fl-tile)"/>

  <!-- Soft highlight for depth -->
  <path d="M0 128C0 57.3 57.3 0 128 0h256c70.7 0 128 57.3 128 128v48C416 96 272 64 144 112 64 144 16 208 0 272V128Z" fill="#ffffff" opacity="0.14"/>

  <!-- Invoice sheet with a peeled, forward-leaning corner (scaled 8x from the 64px mark) -->
  <path d="M136 108A20 20 0 0 1 156 88h145.6L376 162.4V388a20 20 0 0 1-20 20H156a20 20 0 0 1-20-20V108Z" fill="url(#fl-sheet)"/>

  <!-- Folded corner -->
  <path d="M301.6 88 376 162.4h-54.4a20 20 0 0 1-20-20V88Z" fill="#f3b6b0"/>

  <!-- Text lines on the sheet -->
  <rect x="180" y="192" width="120" height="19.2" rx="9.6" fill="#d8a7a2"/>
  <rect x="180" y="235.2" width="80" height="19.2" rx="9.6" fill="#e6c3bf"/>

  <!-- Swiss cross accent (identity anchor) -->
  <path d="M251.2 289.6h17.6v20.8h20.8v17.6h-20.8v20.8h-17.6v-20.8h-20.8v-17.6h20.8v-20.8Z" fill="#d52b1e"/>
</svg>
